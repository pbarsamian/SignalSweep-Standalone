; SignalSweep CYD v3.21-c6b
; Board: ESP32-2432S028R "Cheap Yellow Display"

[platformio]
; plain pio run keeps building the CYD firmware, as before the C6 environments were added
default_envs = cyd

[env:cyd]
platform  = espressif32 @ 6.9.0
board     = esp32dev
framework = arduino

board_build.flash_size = 4MB
; huge_app: 3 MB app partition (no OTA) to fit the vendor database
board_build.partitions = huge_app.csv

extra_scripts = pre:copy_setup_pre.py

; one source tree, one board layer per env (src/boards/<board>/)
build_src_filter = +<*> -<boards/c6_touch147/> -<scan_c6/>

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_CYD
    -Isrc

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^1.4.1

monitor_speed = 115200
upload_speed  = 921600


; --- Waveshare ESP32-C6-Touch-LCD-1.47 -----------------------------------------
; C6 needs arduino-esp32 3.x, which stock espressif32 6.x does not ship, so these envs use the pioarduino
; platform fork. Pinned release 55.03.312-1 = Arduino v3.3.12 on ESP-IDF v5.5.5 (published 2026-09-22).
; The stable alias moved to Arduino 4.0.0 / IDF 6.1.1 on 2026-11-19 and is deliberately not used.
[c6_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; two OTA slots + filesystem on 8 MB (name to be checked against the framework partitions folder)
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_C6_TOUCH147
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lovyan03/LovyanGFX @ 1.3.0
    h2zero/NimBLE-Arduino @ 2.5.2

; Phase 2: separate bring-up sketch (bringup/c6_bringup.cpp), not the SignalSweep firmware
[env:c6bringup]
extends = c6_common
build_src_filter = -<*> +<../bringup/c6_bringup.cpp>

; Phase 3: the scanners with serial output only (src/scan_c6/). Core files are listed explicitly; no UI, no HAL.
[env:c6scan]
extends = c6_common
build_src_filter = -<*> +<focus.cpp> +<signatures.cpp> +<vendor.cpp> +<opendroneid.c> +<odid_wifi.c> +<scanner_wifi.cpp> +<scan_c6/>

; Scaffold only: the full C6 firmware (UI, alerts, SD) does not build until Phases 4 and 5.
[env:c6touch]
extends = c6_common
build_src_filter = +<*> -<boards/cyd/>
